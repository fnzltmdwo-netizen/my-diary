name: Build Seungjae 100 Days APK

on:
  push:
    branches:
      - seungjae-100days-apk
    paths:
      - "sj100/**"
      - ".github/workflows/sj100-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: sj100
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Publish APK into branch
        shell: bash
        run: |
          mkdir -p dist
          cp sj100/app/build/outputs/apk/debug/app-debug.apk dist/Seungjae-100Days-v1.1.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/Seungjae-100Days-v1.1.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "Build Seungjae 100 Days APK [skip ci]"
            git push
          fi
