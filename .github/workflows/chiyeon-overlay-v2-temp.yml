name: Build Chiyeon Overlay V4 Accessibility APK

on:
  push:
    branches: [ chiyeon-overlay-v2-build-20260825 ]
    paths:
      - 'chiyeon_overlay_v2_payload.b64'
      - 'chiyeon_v3_overrides/**'
      - '.github/workflows/chiyeon-overlay-v2-temp.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore base and apply V4 accessibility overlay fix
        run: |
          base64 -d chiyeon_overlay_v2_payload.b64 | tar -xz
          test -f chiyeon_overlay_v2/app/build.gradle
          cp chiyeon_v3_overrides/ChiyeonAccessibilityService.java chiyeon_overlay_v2/app/src/main/java/com/chiyeon/overlay/ChiyeonAccessibilityService.java
          cp chiyeon_v3_overrides/ScreenProfile.java chiyeon_overlay_v2/app/src/main/java/com/chiyeon/overlay/ScreenProfile.java

          # V4 핵심: 일반 앱 오버레이 대신 AccessibilityService 전용 오버레이 사용.
          # 설치/업데이트 후 SYSTEM_ALERT_WINDOW 상태와 무관하게 접근성 서비스가 직접 카드 표시.
          sed -i 's/WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY/WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY/g' chiyeon_overlay_v2/app/src/main/java/com/chiyeon/overlay/ChiyeonAccessibilityService.java
          sed -i 's/ || !Settings.canDrawOverlays(this)//' chiyeon_overlay_v2/app/src/main/java/com/chiyeon/overlay/ChiyeonAccessibilityService.java
          sed -i 's/서비스 연결됨 · V3/서비스 연결됨 · V4 ACCESSIBILITY_OVERLAY/' chiyeon_overlay_v2/app/src/main/java/com/chiyeon/overlay/ChiyeonAccessibilityService.java

          sed -i 's/versionCode 2/versionCode 4/' chiyeon_overlay_v2/app/build.gradle
          sed -i 's/versionName "2.0"/versionName "4.0"/' chiyeon_overlay_v2/app/build.gradle
          sed -i 's/치연 오버레이 V2/치연 오버레이 V4/' chiyeon_overlay_v2/app/src/main/java/com/chiyeon/overlay/MainActivity.java

          grep -n 'TYPE_ACCESSIBILITY_OVERLAY' chiyeon_overlay_v2/app/src/main/java/com/chiyeon/overlay/ChiyeonAccessibilityService.java
          grep -n 'private void show' chiyeon_overlay_v2/app/src/main/java/com/chiyeon/overlay/ChiyeonAccessibilityService.java

      - name: Build debug APK
        working-directory: chiyeon_overlay_v2
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: |
          mkdir -p release
          cp chiyeon_overlay_v2/app/build/outputs/apk/debug/app-debug.apk release/CHIYEON_OVERLAY_V4_ACCESSIBILITY_OVERLAY.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CHIYEON_OVERLAY_V4_ACCESSIBILITY_OVERLAY_APK
          path: release/CHIYEON_OVERLAY_V4_ACCESSIBILITY_OVERLAY.apk
          if-no-files-found: error
          retention-days: 1
