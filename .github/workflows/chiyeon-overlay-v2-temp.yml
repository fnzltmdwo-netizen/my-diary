name: Build Chiyeon Overlay V5 Package Fix APK

on:
  push:
    branches: [ chiyeon-overlay-v2-build-20260825 ]
    paths:
      - 'chiyeon_overlay_v2_payload.b64'
      - 'chiyeon_v3_overrides/**'
      - '.github/workflows/chiyeon-overlay-v2-temp.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore base and apply V5 package matcher
        run: |
          base64 -d chiyeon_overlay_v2_payload.b64 | tar -xz
          test -f chiyeon_overlay_v2/app/build.gradle
          cp chiyeon_v3_overrides/ChiyeonAccessibilityService.java chiyeon_overlay_v2/app/src/main/java/com/chiyeon/overlay/ChiyeonAccessibilityService.java
          cp chiyeon_v3_overrides/ScreenProfile.java chiyeon_overlay_v2/app/src/main/java/com/chiyeon/overlay/ScreenProfile.java

          # 접근성 서비스 전용 오버레이를 사용해 SYSTEM_ALERT_WINDOW 상태와 분리.
          sed -i 's/WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY/WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY/g' chiyeon_overlay_v2/app/src/main/java/com/chiyeon/overlay/ChiyeonAccessibilityService.java
          sed -i 's/ || !Settings.canDrawOverlays(this)//' chiyeon_overlay_v2/app/src/main/java/com/chiyeon/overlay/ChiyeonAccessibilityService.java

          sed -i 's/versionCode 2/versionCode 5/' chiyeon_overlay_v2/app/build.gradle
          sed -i 's/versionName "2.0"/versionName "5.0"/' chiyeon_overlay_v2/app/build.gradle
          sed -i 's/치연 오버레이 V2/치연 오버레이 V5/' chiyeon_overlay_v2/app/src/main/java/com/chiyeon/overlay/MainActivity.java

          grep -n 'com.realbyteapps.moneya' chiyeon_overlay_v2/app/src/main/java/com/chiyeon/overlay/ChiyeonAccessibilityService.java
          grep -n 'startsWith("com.realbyteapps.money")' chiyeon_overlay_v2/app/src/main/java/com/chiyeon/overlay/ChiyeonAccessibilityService.java
          grep -n 'TYPE_ACCESSIBILITY_OVERLAY' chiyeon_overlay_v2/app/src/main/java/com/chiyeon/overlay/ChiyeonAccessibilityService.java

      - name: Build debug APK
        working-directory: chiyeon_overlay_v2
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: |
          mkdir -p release
          cp chiyeon_overlay_v2/app/build/outputs/apk/debug/app-debug.apk release/CHIYEON_OVERLAY_V5_CHIYEON_MONEY_PACKAGE_FIX.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CHIYEON_OVERLAY_V5_CHIYEON_MONEY_PACKAGE_FIX_APK
          path: release/CHIYEON_OVERLAY_V5_CHIYEON_MONEY_PACKAGE_FIX.apk
          if-no-files-found: error
          retention-days: 1
