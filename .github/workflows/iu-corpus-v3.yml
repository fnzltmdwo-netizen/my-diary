name: Build IU Brain Corpus v3 Source Aware

on:
  workflow_dispatch:
    inputs:
      max_videos:
        description: "이번 실행 최대 검증 영상 수"
        required: false
        default: "150"
      max_ai_calls:
        description: "자막 관찰치 추출 최대 AI 호출 수"
        required: false
        default: "220"
      max_discovery_calls:
        description: "웹검색 발견 호출 수"
        required: false
        default: "14"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r iu_corpus/requirements.txt
      - name: Source-aware web discovery and transcript enrichment
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
          MAX_VIDEOS: ${{ inputs.max_videos }}
          MAX_AI_CALLS: ${{ inputs.max_ai_calls }}
          MAX_DISCOVERY_CALLS: ${{ inputs.max_discovery_calls }}
          SEARCH_BATCH_SIZE: "5"
        run: python iu_corpus/collector_v3.py
      - name: Show run summary
        if: always()
        run: cat iu_corpus/run_summary.json 2>/dev/null || true
      - name: Commit corpus growth
        if: always()
        run: |
          git config user.name "IU Corpus Bot"
          git config user.email "actions@users.noreply.github.com"
          git add iu_corpus/source_registry.jsonl iu_corpus/observations.jsonl iu_corpus/errors.jsonl iu_corpus/run_summary.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No corpus changes"
          else
            git commit -m "Grow IU Brain Corpus v3"
            git pull --rebase origin main || true
            git push
          fi
