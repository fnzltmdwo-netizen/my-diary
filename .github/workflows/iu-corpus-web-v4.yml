name: Build IU Brain Corpus v4 Web Only Budget

on:
  workflow_dispatch:
    inputs:
      target_observations:
        description: "최종 목표 관찰치"
        required: false
        default: "5000"
      total_budget_usd:
        description: "이 수집기의 누적 예상 비용 상한(USD)"
        required: false
        default: "3.50"
      max_requests:
        description: "이번 실행 최대 웹검색 요청 수"
        required: false
        default: "60"
      observations_per_request:
        description: "요청당 최대 관찰치"
        required: false
        default: "120"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install OpenAI SDK
        run: pip install openai
      - name: Web-only budget corpus collection
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
          TARGET_OBSERVATIONS: ${{ inputs.target_observations }}
          TOTAL_BUDGET_USD: ${{ inputs.total_budget_usd }}
          MAX_REQUESTS: ${{ inputs.max_requests }}
          OBS_PER_REQUEST: ${{ inputs.observations_per_request }}
        run: python iu_corpus/collector_web_v4.py
      - name: Show summary
        if: always()
        run: |
          cat iu_corpus/web_run_summary.json 2>/dev/null || true
          cat iu_corpus/cost_ledger.json 2>/dev/null || true
      - name: Commit corpus growth
        if: always()
        run: |
          git config user.name "IU Corpus Bot"
          git config user.email "actions@users.noreply.github.com"
          git add iu_corpus/observations.jsonl iu_corpus/errors.jsonl iu_corpus/web_run_summary.json iu_corpus/cost_ledger.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No corpus changes"
          else
            git commit -m "Grow IU Brain Corpus v4 web-only"
            git pull --rebase origin main || true
            git push
          fi
