<!DOCTYPE html>

<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Diary</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>


<body>


<main class="diary-wrapper">


    <!-- =====================================
         오늘 다이어리
    ====================================== -->

    <section class="diary-page">


        <header class="diary-header">

            <button
                id="prevDayBtn"
                class="date-button"
                type="button"
            >
                ‹
            </button>


            <div class="date-area">

                <p class="month-text">
                    JULY
                </p>

                <h1 id="dayText">
                    26
                </h1>

                <p id="weekdayText">
                    SUNDAY
                </p>

            </div>


            <button
                id="nextDayBtn"
                class="date-button"
                type="button"
            >
                ›
            </button>

        </header>


        <div class="divider"></div>


        <!-- 일정 -->

        <section class="planner-section">

            <div class="section-title-row">

                <h2>
                    TODAY PLAN
                </h2>

                <button
                    id="addScheduleBtn"
                    class="small-button"
                    type="button"
                >
                    + 일정
                </button>

            </div>


            <div
                id="scheduleList"
                class="schedule-list"
            ></div>

        </section>


        <!-- 할 일 -->

        <section class="planner-section">

            <div class="section-title-row">

                <h2>
                    TODAY TODO
                </h2>

                <button
                    id="addTodoBtn"
                    class="small-button"
                    type="button"
                >
                    + 할 일
                </button>

            </div>


            <div
                id="todoList"
                class="todo-list"
            ></div>

        </section>


        <!-- 메모 -->

        <section class="planner-section">

            <h2>
                DAILY NOTE
            </h2>

            <textarea
                id="dailyNote"
                placeholder="오늘의 기록을 남겨보세요."
            ></textarea>

        </section>


    </section>



    <!-- =====================================
         월간 달력
    ====================================== -->

    <section
        id="calendarPage"
        class="calendar-page hidden"
    >

        <div class="calendar-header">

            <button
                id="prevMonthBtn"
                class="date-button"
                type="button"
            >
                ‹
            </button>


            <div class="calendar-title-area">

                <p id="calendarYear">
                    2026
                </p>

                <h2 id="calendarMonth">
                    JULY
                </h2>

            </div>


            <button
                id="nextMonthBtn"
                class="date-button"
                type="button"
            >
                ›
            </button>

        </div>


        <div class="calendar-weekdays">

            <span>SUN</span>
            <span>MON</span>
            <span>TUE</span>
            <span>WED</span>
            <span>THU</span>
            <span>FRI</span>
            <span>SAT</span>

        </div>


        <div
            id="calendarGrid"
            class="calendar-grid"
        ></div>

    </section>



    <!-- =====================================
         검색
    ====================================== -->

    <section
        id="searchPage"
        class="search-page hidden"
    >

        <div class="search-header">

            <p class="search-small-title">
                MY DIARY
            </p>

            <h2>
                SEARCH
            </h2>

            <p class="search-description">
                지난 일정, 할 일, 메모를 찾아보세요.
            </p>

        </div>


        <div class="search-box">

            <span class="search-icon">
                🔎
            </span>

            <input
                id="searchInput"
                type="search"
                placeholder="예: 파이썬, 병원, 약속"
                autocomplete="off"
            >

            <button
                id="searchBtn"
                type="button"
            >
                검색
            </button>

        </div>


        <div
            id="searchInfo"
            class="search-info"
        >
            검색어를 입력해주세요.
        </div>


        <div
            id="searchResults"
            class="search-results"
        ></div>

    </section>


</main>



<!-- =====================================
     일정 추가
====================================== -->

<div
    id="scheduleModal"
    class="modal hidden"
>

    <div class="modal-box">

        <div class="modal-header">

            <h3>
                일정 추가
            </h3>

            <button
                id="closeScheduleModal"
                class="modal-close"
                type="button"
            >
                ×
            </button>

        </div>


        <label class="input-label">
            시간
        </label>

        <input
            id="scheduleTimeInput"
            type="time"
            class="modal-input"
        >


        <label class="input-label">
            일정 내용
        </label>

        <input
            id="scheduleTextInput"
            type="text"
            class="modal-input"
            placeholder="예: 파이썬 공부"
        >


        <label class="input-label">
            카테고리
        </label>

        <select
            id="scheduleCategoryInput"
            class="modal-input"
        >

            <option value="daily">
                🌿 일상
            </option>

            <option value="study">
                📚 공부
            </option>

            <option value="exercise">
                🏃 운동
            </option>

            <option value="appointment">
                💕 약속
            </option>

            <option value="work">
                💼 업무
            </option>

            <option value="etc">
                ✨ 기타
            </option>

        </select>


        <label class="input-label">
            반복
        </label>

        <select
            id="scheduleRepeatInput"
            class="modal-input"
        >

            <option value="none">
                반복 안 함
            </option>

            <option value="daily">
                🔁 매일
            </option>

            <option value="weekly">
                🔁 매주 같은 요일
            </option>

            <option value="monthly">
                🔁 매월 같은 날짜
            </option>

        </select>


        <div
            id="scheduleRepeatUntilArea"
            class="hidden"
        >

            <label class="input-label">
                반복 종료일
            </label>

            <input
                id="scheduleRepeatUntilInput"
                type="date"
                class="modal-input"
            >

            <p class="input-help">
                비워두면 계속 반복돼요.
            </p>

        </div>


        <label class="important-option">

            <input
                id="scheduleImportantInput"
                type="checkbox"
            >

            <span>
                ⭐ 중요한 일정으로 표시
            </span>

        </label>


        <button
            id="saveScheduleBtn"
            class="save-button"
            type="button"
        >
            저장
        </button>

    </div>

</div>



<!-- =====================================
     TODO 추가
====================================== -->

<div
    id="todoModal"
    class="modal hidden"
>

    <div class="modal-box">

        <div class="modal-header">

            <h3>
                할 일 추가
            </h3>

            <button
                id="closeTodoModal"
                class="modal-close"
                type="button"
            >
                ×
            </button>

        </div>


        <label class="input-label">
            할 일
        </label>

        <input
            id="todoTextInput"
            type="text"
            class="modal-input"
            placeholder="예: 영어 공부"
        >


        <button
            id="saveTodoBtn"
            class="save-button"
            type="button"
        >
            저장
        </button>

    </div>

</div>



<!-- =====================================
     일정 수정
====================================== -->

<div
    id="editScheduleModal"
    class="modal hidden"
>

    <div class="modal-box">

        <div class="modal-header">

            <h3>
                일정 수정
            </h3>

            <button
                id="closeEditScheduleModal"
                class="modal-close"
                type="button"
            >
                ×
            </button>

        </div>


        <label class="input-label">
            시간
        </label>

        <input
            id="editScheduleTimeInput"
            type="time"
            class="modal-input"
        >


        <label class="input-label">
            일정 내용
        </label>

        <input
            id="editScheduleTextInput"
            type="text"
            class="modal-input"
        >


        <label class="input-label">
            카테고리
        </label>

        <select
            id="editScheduleCategoryInput"
            class="modal-input"
        >

            <option value="daily">
                🌿 일상
            </option>

            <option value="study">
                📚 공부
            </option>

            <option value="exercise">
                🏃 운동
            </option>

            <option value="appointment">
                💕 약속
            </option>

            <option value="work">
                💼 업무
            </option>

            <option value="etc">
                ✨ 기타
            </option>

        </select>


        <label class="input-label">
            반복
        </label>

        <select
            id="editScheduleRepeatInput"
            class="modal-input"
        >

            <option value="none">
                반복 안 함
            </option>

            <option value="daily">
                🔁 매일
            </option>

            <option value="weekly">
                🔁 매주 같은 요일
            </option>

            <option value="monthly">
                🔁 매월 같은 날짜
            </option>

        </select>


        <div
            id="editScheduleRepeatUntilArea"
            class="hidden"
        >

            <label class="input-label">
                반복 종료일
            </label>

            <input
                id="editScheduleRepeatUntilInput"
                type="date"
                class="modal-input"
            >

            <p class="input-help">
                비워두면 계속 반복돼요.
            </p>

        </div>


        <label class="important-option">

            <input
                id="editScheduleImportantInput"
                type="checkbox"
            >

            <span>
                ⭐ 중요한 일정으로 표시
            </span>

        </label>


        <p class="edit-repeat-warning">
            🔁 반복 일정 수정 시 전체 반복 일정이 변경됩니다.
        </p>


        <button
            id="saveEditScheduleBtn"
            class="save-button"
            type="button"
        >
            수정 저장
        </button>

    </div>

</div>



<!-- =====================================
     TODO 수정
====================================== -->

<div
    id="editTodoModal"
    class="modal hidden"
>

    <div class="modal-box">

        <div class="modal-header">

            <h3>
                할 일 수정
            </h3>

            <button
                id="closeEditTodoModal"
                class="modal-close"
                type="button"
            >
                ×
            </button>

        </div>


        <label class="input-label">
            할 일
        </label>

        <input
            id="editTodoTextInput"
            type="text"
            class="modal-input"
        >


        <button
            id="saveEditTodoBtn"
            class="save-button"
            type="button"
        >
            수정 저장
        </button>

    </div>

</div>



<!-- =====================================
     하단 메뉴
====================================== -->

<nav class="bottom-nav">


    <button
        id="todayNavBtn"
        class="nav-button active"
        type="button"
    >

        <span class="nav-icon">
            🏠
        </span>

        <span>
            오늘
        </span>

    </button>


    <button
        id="calendarNavBtn"
        class="nav-button"
        type="button"
    >

        <span class="nav-icon">
            📅
        </span>

        <span>
            달력
        </span>

    </button>


    <button
        id="quickAddBtn"
        class="nav-button add-nav-button"
        type="button"
    >

        <span class="nav-icon">
            ＋
        </span>

    </button>


    <button
        id="searchNavBtn"
        class="nav-button"
        type="button"
    >

        <span class="nav-icon">
            🔎
        </span>

        <span>
            검색
        </span>

    </button>


    <button
        id="settingsNavBtn"
        class="nav-button"
        type="button"
    >

        <span class="nav-icon">
            ⚙️
        </span>

        <span>
            설정
        </span>

    </button>


</nav>


<script src="/static/script.js"></script>


</body>

</html>
