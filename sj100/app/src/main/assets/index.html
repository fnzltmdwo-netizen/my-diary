<!doctype html>
<html lang="ko">
<head>

<style>
@font-face{font-family:NanumSquareNeo;src:url('https://hangeul.pstatic.net/hangeul_static/webfont/NanumSquareNeo/NanumSquareNeoTTF-bRg.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:NanumSquareNeo;src:url('https://hangeul.pstatic.net/hangeul_static/webfont/NanumSquareNeo/NanumSquareNeoTTF-dEb.woff2') format('woff2');font-weight:700;font-display:swap}
:root{--desk:#eadfce;--paper:#fffaf0;--paper2:#f8f0df;--ink:#302a25;--muted:#76695d;--peach:#e8907c;--sage:#8fa887;--blue:#8aa6b8;--line:#d7c7b3;--shadow:0 16px 45px rgba(75,54,35,.13)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--desk);color:var(--ink);font-family:NanumSquareNeo,'Noto Sans KR',sans-serif}
body{background-image:linear-gradient(90deg,rgba(80,60,40,.025) 1px,transparent 1px),linear-gradient(rgba(80,60,40,.018) 1px,transparent 1px);background-size:28px 28px}
.app{width:min(820px,100%);margin:auto;padding:23px 16px 112px}
.top{display:flex;justify-content:space-between;align-items:center;margin:2px 3px 18px}.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--muted);font-weight:700}.top h1{font-size:31px;margin:3px 0 0;letter-spacing:-.06em}.top h1:after{content:'';display:block;width:61px;height:7px;margin-top:-3px;background:rgba(232,144,124,.38);border-radius:50%;transform:rotate(-2deg)}
.hero,.letter,.practice,.note,.tool{border:1px solid var(--line);box-shadow:var(--shadow);position:relative}.hero{padding:25px 23px 20px;background:var(--paper2);border-radius:8px 8px 19px 8px;transform:rotate(-.15deg);overflow:hidden}.hero:after{content:'✦  ✎';position:absolute;right:17px;bottom:16px;color:rgba(48,42,37,.18);font-size:23px;letter-spacing:7px;transform:rotate(-8deg)}.badge{display:inline-block;padding:7px 10px;border:1.5px solid var(--ink);border-radius:4px;font-size:11px;font-weight:700;letter-spacing:.09em;transform:rotate(-1.8deg)}h2{font-size:28px;line-height:1.32;letter-spacing:-.055em;margin:15px 0 10px;max-width:91%}.lead{color:var(--muted);line-height:1.75;font-size:15px;margin:0;max-width:94%}.prog{display:flex;gap:10px;align-items:center;margin-top:20px}.track{height:7px;flex:1;background:rgba(48,42,37,.09);border-radius:99px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,var(--peach),#d77867);border-radius:99px}.prog small{font-weight:700;color:var(--muted)}
.letter{margin-top:17px;padding:30px 23px 25px;background:var(--paper);border-radius:6px 16px 8px 14px;transform:rotate(.1deg)}.tape{position:absolute;top:-9px;width:78px;height:21px;background:rgba(235,209,165,.62);clip-path:polygon(3% 8%,96% 0,100% 90%,4% 100%,0 19%)}.tl{left:24px;transform:rotate(-4deg)}.tr{right:25px;transform:rotate(4deg)}.kicker{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.08em}.message{font-size:17px;line-height:1.95;word-break:keep-all}.message p{margin:16px 0}.quote{padding:17px 18px;margin-top:22px;background:#f6e9df;border-radius:7px 13px 9px 8px;font-weight:700;line-height:1.72;transform:rotate(-.3deg)}
.practice{margin-top:17px;padding:23px;background:#f5f0dc;border-radius:14px 6px 15px 8px}.practice h3{margin:0 0 10px;font-size:15px}.practice p{margin:0 0 16px;color:var(--muted);line-height:1.8}.primary{width:100%;padding:14px;border:1.5px solid var(--ink);border-radius:8px;background:var(--ink);color:var(--paper);font-weight:700}.primary.done{background:var(--sage);border-color:var(--sage)}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:17px}.tool{padding:17px;background:var(--paper);border-radius:15px 7px 13px 9px;text-align:left;min-height:104px}.tool:nth-child(2){transform:rotate(.35deg)}.tool b{display:block;margin:8px 0 4px}.tool small{color:var(--muted);line-height:1.5}.note{margin-top:17px;padding:22px;background:var(--paper);border-radius:8px 13px 7px 14px}.note b{font-size:14px}.note textarea{width:100%;min-height:92px;margin-top:12px;border:0;outline:0;resize:vertical;color:var(--ink);background:repeating-linear-gradient(to bottom,transparent 0,transparent 28px,rgba(138,166,184,.24) 29px,transparent 30px);line-height:30px;font:inherit}.saveNote{border:0;background:transparent;color:#b65f52;font-weight:700;padding:8px 0 0}
.nav{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(785px,calc(100% - 24px));display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;padding:8px;background:rgba(255,250,240,.92);border:1px solid rgba(176,152,126,.55);border-radius:16px;box-shadow:0 12px 32px rgba(55,43,32,.16)}.nav button{border:0;background:transparent;padding:12px 7px;font:inherit;font-weight:700;color:var(--ink)}.nav .today{background:rgba(232,144,124,.17);border-radius:9px}
dialog{width:min(550px,calc(100% - 28px));border:1px solid var(--line);border-radius:8px 17px 9px 14px;background:var(--paper);color:var(--ink);padding:27px 24px;box-shadow:0 28px 90px rgba(0,0,0,.25)}dialog::backdrop{background:rgba(33,28,24,.48)}dialog h3{font-size:23px;margin:8px 0 16px}dialog ol{padding-left:21px}dialog li{padding:8px 0;line-height:1.55}dialog span{display:block;color:var(--muted);font-size:13px;margin-top:2px}.close{position:absolute;right:13px;top:10px;border:0;background:var(--paper2);width:34px;height:34px;border-radius:50%;font-size:20px}
@media(max-width:430px){.app{padding-left:14px;padding-right:14px}.hero{padding:22px 19px}.hero h2{font-size:25px}.letter,.practice,.note{padding-left:20px;padding-right:20px}.message{font-size:16.5px}}
</style>
</head>
<body>
<main class="app">
<header class="top"><div><div class="eyebrow">승재에게 보내는</div><h1>100일의 말</h1></div><div style="font-size:24px;transform:rotate(8deg)">☁︎</div></header>
<section class="hero"><span id="badge" class="badge">DAY 1</span><h2 id="title"></h2><p id="lead" class="lead"></p><div class="prog"><div class="track"><div id="bar" class="bar"></div></div><small id="progress"></small></div></section>
<section class="letter"><i class="tape tl"></i><i class="tape tr"></i><div class="kicker">오늘 승재에게</div><div id="message" class="message"></div><div id="anchor" class="quote"></div></section>
<section class="practice"><h3>오늘의 실전 ✦</h3><p id="practice"></p><button id="done" class="primary">오늘 읽음 ✓</button></section>
<section class="tools"><button id="ground" class="tool"><span style="font-size:24px">↩</span><b>1분 현실복귀</b><small>반추에서 빠져나오는 짧은 루틴</small></button><button id="favorite" class="tool"><span style="font-size:24px">♡</span><b>마음에 저장</b><small>다시 읽고 싶은 날 표시</small></button></section>
<section class="note"><b>✎ 오늘 한 줄</b><textarea id="memo" placeholder="지금 내 마음을 한 줄만 남겨봐."></textarea><button id="saveNote" class="saveNote">저장하기</button></section>
<nav class="nav"><button id="prev">← 이전</button><button class="today">오늘</button><button id="next">다음 →</button></nav>
</main>
<dialog id="dlg"><button id="close" class="close">×</button><div class="eyebrow">60초만</div><h3>상상에서 현실로 돌아오기</h3><ol><li><b>이름 붙이기</b><span>“아, 지금 반추 중이네.”</span></li><li><b>사실 한 줄</b><span>“지금 확인된 사실은 여기까지.”</span></li><li><b>몸으로 돌아오기</b><span>발바닥 꾹 · 어깨 힘 빼기 · 길게 내쉬기</span></li><li><b>결론 보류</b><span>“아직 몰라. 지금 해결 안 해도 돼.”</span></li><li><b>현재 행동 하나</b><span>물 한 모금 · 1분 걷기 · 업무 하나 열기</span></li></ol><div class="quote">내 관심은 다시 내 쪽으로.</div></dialog>
<script>
const phases=[
{name:"내 편이 되는 연습",intro:"승재야, 첫 번째 축은 다른 사람보다 먼저 네 곁에 남는 연습이야. 잘했을 때만 네 편이 되는 건 진짜 내 편이 아니야. 실수하고 흔들리고 인정받지 못했다고 느끼는 날에도 너를 버리지 않는 태도가 필요해.",core:"지금의 목표는 완벽한 사람이 되는 게 아니라, 힘든 순간에 자기 자신을 공격하지 않고 돌보는 사람이 되는 거야. 남에게 하듯 네 마음에도 맥락과 시간을 줘."},
{name:"반추와 현실검증",intro:"승재는 생각이 깊은 사람이지만 불안할 때는 그 깊이가 한 방향으로만 파고들 수 있어. 사실 하나에서 시작해 해석을 붙이고, 그 해석을 다시 사실처럼 믿으면 마음이 점점 좁아져.",core:"생각을 없애려고 싸우기보다 사실과 해석을 분리하고, 모르는 건 모르는 채로 두는 연습을 하자. 반추에서 돌아오는 횟수가 많아질수록 마음의 복귀력이 커져."},
{name:"관계와 경계",intro:"관계가 중요할수록 승재는 상대의 마음을 먼저 챙기고 자기 불편함을 뒤로 미루기 쉬웠어. 그러다 보면 작은 불편함이 쌓여 큰 분노가 필요해져.",core:"건강한 관계는 참는 능력보다 제때 작은 경계를 말하는 능력으로 유지돼. 상대를 악마로 만들지 않아도 거리를 조절할 수 있고, 화해해도 경계는 남길 수 있어."},
{name:"인정욕구와 비교",intro:"누군가가 반응을 많이 받는 장면을 보면 ‘나는?’이라는 질문이 자동으로 올라올 수 있어. 그 순간 존재감을 증명하고 싶은 마음이 커지는 것도 자연스러워.",core:"하지만 다른 사람의 +1이 승재의 -1은 아니야. 인정받고 싶은 마음은 인정하되, 그 마음이 행동의 운전대를 잡게 두지 않는 연습이 필요해."},
{name:"우울한 날의 돌봄",intro:"우울한 시기에는 세상이 실제보다 더 막막하고 사람은 실제보다 더 위협적으로 느껴질 수 있어. 그때 떠오르는 생각을 인생 전체의 판결문으로 쓰지 말자.",core:"회복은 다시는 무너지지 않는 게 아니라 무너졌을 때 더 빨리 돌봄으로 돌아오는 일이야. 지금의 승재는 채찍보다 회복자원이 필요한 사람일 수 있어."},
{name:"ADHD식 실행관리",intro:"승재의 머릿속에서는 생각이 빠르고 연결도 빠른데, 실행은 시작점이 흐려지거나 다른 자극으로 튈 수 있어. 의지 부족으로 설명하면 도움이 안 돼.",core:"환경을 단순하게 만들고 행동을 작게 쪼개고, 시작 신호를 외부에 만들어두자. 점프를 막는 게 아니라 브릿지를 만드는 방식이 승재에게 더 맞아."},
{name:"일과 성장",intro:"일을 잘해야만 가치 있는 사람이 되는 건 아니야. 업무는 능력을 연습하는 장소이지 사람값을 매기는 시험장이 아니야.",core:"실수는 기록하고 수정하면 되고, 모르는 건 묻고 배우면 돼. 한 번에 모든 걸 잘하려 하기보다 오늘의 한 가지를 끝내는 경험을 쌓자."},
{name:"수면과 몸",intro:"마음이 흔들릴 때 몸의 상태를 빼놓으면 설명이 자꾸 왜곡돼. 졸림, 수면의 질, 긴장, 식사, 약물 효과 같은 신체 조건은 감정과 집중에 직접 영향을 줘.",core:"몸을 적처럼 다루지 말고 데이터를 주는 동료처럼 보자. 충분한 수면, 양압기 같은 치료, 진료와 약 복용은 의지와 별개의 기본 토대야."},
{name:"소비와 충동",intro:"새 물건이나 새로운 선택은 순간적으로 기분과 자기이미지를 바꿔주는 것처럼 느껴질 수 있어. 특히 지치고 인정받고 싶은 날엔 결제 속도가 빨라질 수 있어.",core:"사고 싶은 마음은 허용하되 구매 행동은 미래의 승재와 함께 결정하자. 자기비난보다 대기시간과 예산 같은 구조가 충동을 더 잘 막아줘."},
{name:"통합과 앞으로의 승재",intro:"100일의 마지막 구간은 더 많은 조언을 모으는 시간이 아니라, 필요한 순간에 몇 개의 문장을 실제 행동으로 꺼내 쓰는 시간이야.",core:"결국 종착지는 완벽한 승재가 아니야. 흔들리고 실수해도 자기 손을 놓지 않는 승재, 다른 사람을 사랑하면서 자기 자신도 관계 안에 같이 데려가는 승재야."}
];
const tips=[
[
["오늘은 네 편에 서는 날","힘든 순간 ‘왜 이래?’보다 ‘많이 힘들구나’를 먼저 말해줘.","가슴에 손을 얹고 “승재야, 오늘도 같이 가자”라고 한 번 말하기.","무슨 일이 있어도 나는 나를 버리지 않는다."],
["잘해야 사랑받는다는 규칙 내려놓기","업무 실수나 말실수는 수정할 사건이지 네 가치의 점수가 아니야.","실수 하나를 떠올리고 ‘행동은 수정 가능, 내 가치는 그대로’라고 적기.","행동은 고쳐도, 사람인 나까지 깎지 않는다."],
["나도 돌봐야 할 한 사람","남의 기분을 빠르게 읽는 능력은 장점이지만 네 상태를 빼먹으면 자기삭제가 돼.","결정 전 ‘상대에게 좋은가?’와 ‘나에게도 좋은가?’를 같이 묻기.","남을 소중히 여기는 명단에 나도 넣는다."],
["힘든 나를 혼자 두지 않기","아픈 자신에게 일을 더 시키지 말자. 회복이 필요한 날엔 목표를 줄여도 돼.","오늘 꼭 필요한 일 1개만 남기고 나머지는 미뤄도 되는지 보기.","나는 무너질 수 있다. 그래도 그때의 나를 혼자 두고 가지 않는다."],
["작은 불편함을 제때 챙기기","처음의 10짜리 불편함을 무시하면 나중엔 100짜리 분노가 필요해져.","작은 불편함 하나를 부드럽게 한 문장으로 표현하기.","작은 경계가 큰 폭발을 막아준다."],
["좋은 사람과 만만한 사람은 다르다","친절하고 웃긴 사람이라고 함부로 대해도 되는 사람은 아니야.","불편했던 사람 대신 불편했던 ‘행동’을 한 문장으로 적기.","웃긴 사람일 수는 있어도 우습게 대해도 되는 사람은 아니다."],
["사과와 자기보호를 동시에","내 몫은 깨끗하게 사과하고 상대의 선 넘음은 별개의 이야기로 다루면 돼.","사과 문장과 경계 문장을 따로 써보기.","사과는 깨끗하게, 경계는 따로."],
["증명하지 않아도 되는 날","‘나도 이런 사람이야’를 보여주고 싶을 때 공유 욕구와 증명 욕구를 구분해보자.","SNS나 톡방에 올리기 전 ‘공유인가 증명인가?’ 묻기.","나는 증명하지 않아도 여기 있어도 되는 사람이다."],
["내 편으로 돌아오는 기술","흔들리지 않는 사람이 아니라 흔들린 뒤 돌아오는 사람이 강한 사람이야.","흔들리는 순간 ‘지금 내가 통제할 수 있는 행동 한 가지는?’ 찾기.","흔들려도 다시 내 자리로 돌아온다."],
["10일째, 작은 반복을 믿기","완벽히 실천하지 못했어도 다시 읽고 다시 돌아온 횟수가 이미 훈련이야.","지난 10일 중 가장 마음에 남은 문장 하나 저장하기.","변화는 반복해서 돌아오는 작은 방향에서 생긴다."]
],
[
["생각은 사실이 아니다","머릿속 문장에 증거표를 붙여보자. 사실과 해석이 분리되면 숨 쉴 공간이 생겨.","걱정 하나를 ‘사실 / 해석 / 아직 모름’ 세 칸으로 적기.","빈칸은 빈칸으로 남겨도 된다."],
["상상의 나래에서 돌아오기","반추가 시작되면 더 생각해서 해결하려 하지 말고 상태에 이름부터 붙여.","‘아, 지금 반추 중이네’라고 말하고 10번 천천히 걷기.","또 갔네. 다시 오자."],
