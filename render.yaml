services:
  - type: web
    name: my-sea-diary
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main_v45:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: my-sea-db
          property: connectionString
      - key: APP_PASSWORD
        sync: false

  - type: web
    name: maeumgyeol-v4
    runtime: python
    plan: free
    region: singapore
    rootDir: mental-journal-v4
    buildFilter:
      paths:
        - mental-journal-v4/**
      ignoredPaths: []
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn bootstrap:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: APP_TOKEN
        sync: false
      - key: DEFAULT_MODEL
        value: gpt-5.6-luna
      - key: ALLOWED_ORIGINS
        value: "*"

databases:
  - name: my-sea-db
    plan: free
    region: singapore
    databaseName: my_sea
    user: my_sea_user
