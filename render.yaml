services:
  - type: web
    name: my-sea-diary
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: my-sea-db
          property: connectionString
      - key: APP_PASSWORD
        sync: false

databases:
  - name: my-sea-db
    plan: free
    region: singapore
    databaseName: my_sea
    user: my_sea_user
